<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/Logo.png" />
    
    <!-- ✅ UPDATED VIEWPORT: Mobile aur WebView mein zoom/overflow rokne ke liye -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="PlutoAstro - AI-Powered Astrology, Kundli, and Horoscope"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/Logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <title>PlutoAstro</title>

    <!-- ✅ Plausible Analytics Script -->
    <script async defer src="https://plausible.io/js/pa-jQ-pzE7ZE8mUhlsIo80_f.js"></script>
    <script>
      window.plausible = window.plausible || function() {
        (plausible.q = plausible.q || []).push(arguments);
      };
      plausible.init = plausible.init || function(i) {
        plausible.o = i || {};
      };
      plausible.init();
    </script>

    <!-- ✅ GLOBAL OVERFLOW FIX: Side se cut hone ya scroll aane ki problem khatam karega -->
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden; /* Horizontal scroll hamesha ke liye band */
      }
      * {
        box-sizing: border-box;
        max-width: 100%;
      }
      /* Bade text ko mobile par automatically adjust karne ke liye */
      h1, h2, h3, h4, h5, h6 {
        word-wrap: break-word;
        overflow-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
